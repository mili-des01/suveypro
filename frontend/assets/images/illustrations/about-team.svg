<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none">
  <rect width="720" height="520" fill="#22384a"/>
  <!-- table with plans -->
  <rect x="120" y="330" width="480" height="26" rx="8" fill="#F7F7F4"/>
  <rect x="150" y="300" width="180" height="30" rx="3" fill="#F7F7F4" transform="rotate(-4 150 300)"/>
  <rect x="360" y="302" width="200" height="30" rx="3" fill="#C7A56A" transform="rotate(3 360 302)"/>
  <path d="M170 316 h130 M390 318 h150" stroke="#22384a" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- figure left -->
  <g fill="#F7F7F4">
    <circle cx="250" cy="180" r="20"/>
    <path d="M250 205 c-24 0 -36 19 -36 44 v60 h20 l6 -62 h20 l6 62 h20 v-60 c0 -25 -12 -44 -36 -44z"/>
    <path d="M282 222 l40 -24 7 11 -40 24z"/>
  </g>
  <!-- figure right with hard hat -->
  <g fill="#C7A56A">
    <circle cx="470" cy="175" r="20"/>
    <path d="M470 200 c-24 0 -36 19 -36 44 v65 h20 l6 -67 h20 l6 67 h20 v-65 c0 -25 -12 -44 -36 -44z"/>
    <path d="M448 158 a24 24 0 0 1 44 0 z"/>
    <rect x="440" y="152" width="60" height="8" rx="4"/>
  </g>
  <!-- level / theodolite on table -->
  <g>
    <rect x="560" y="286" width="46" height="18" rx="5" fill="#C7A56A"/>
    <path d="M583 286 v-16" stroke="#F7F7F4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="583" cy="264" r="7" fill="#F7F7F4"/>
  </g>
  <!-- window frames -->
  <g stroke="#2a4256" stroke-width="4">
    <rect x="60" y="60" width="600" height="200" rx="10"/>
    <path d="M260 60 v200 M460 60 v200"/>
  </g>
  <!-- floor line -->
  <path d="M0 356 H720" stroke="#2a4256" stroke-width="3"/>
</svg>
