<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | SurveyPro Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script defer src="/js/icons.js"></script>
  <script defer src="/js/api.js"></script>
  <script defer src="/js/ui.js"></script>
  <script defer src="/js/admin.js"></script>
</head>
<body>
  <div class="admin-topbar">
    <div class="topbar-left"><h1>Projects</h1></div>
    <div class="topbar-actions">
      <a class="btn btn--sm btn--primary" href="project-form.html">New Project</a>
    </div>
  </div>
  <div class="admin-content">
    <div class="panel">
      <div class="toolbar">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="search" id="projects-search" placeholder="Search title or location…" aria-label="Search projects">
        </div>
        <select id="projects-filter" aria-label="Filter by category" style="padding:9px 12px;border:1px solid var(--light-gray);border-radius:6px;font-family:var(--font);">
          <option value="">All categories</option>
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
          <option value="construction">Construction</option>
          <option value="land_development">Land Development</option>
          <option value="topographical">Topographical</option>
          <option value="boundary">Boundary</option>
        </select>
      </div>
      <div id="projects-table" style="padding:0 22px 22px;"></div>
      <div class="pagination" id="projects-pagination" style="padding-bottom:20px;"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      if (!(await Admin.renderShell('projects', 'Projects'))) return;

      const state = { page: 1, search: '', category: '' };
      const tableEl = document.getElementById('projects-table');
      let debounce;

      async function load() {
        tableEl.innerHTML = UI.loadingBlock('Loading projects…');
        const params = new URLSearchParams({ page: state.page, limit: 12 });
        if (state.search) params.set('search', state.search);
        if (state.category) params.set('category', state.category);
        try {
          const res = await API.get(`/projects?${params}`);
          tableEl.innerHTML = Admin.table(
            [
              { label: 'Project', width: '34%', render: (p) => `
                <div style="display:flex;gap:12px;align-items:center;">
                  <img src="${UI.esc(p.coverImageUrl || '/assets/images/illustrations/project-default.svg')}" alt="" style="width:56px;height:40px;object-fit:cover;border-radius:5px;flex:none;">
                  <div><strong style="color:var(--navy);display:block;">${UI.esc(p.title)}</strong>
                  <span style="font-size:.8rem;color:var(--gray);">${UI.esc(p.location || '—')}</span></div>
                </div>` },
              { label: 'Category', render: (p) => `<span class="badge badge--category">${UI.esc(UI.categoryLabel(p.category))}</span>` },
              { label: 'Completed', render: (p) => UI.formatDate(p.completionDate) },
              { label: 'Status', render: (p) => `
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${p.published ? UI.statusBadge('published') : UI.statusBadge('draft')}
                  ${p.featured ? `<span class="badge badge--featured">${Icons.svg('star')}Featured</span>` : ''}
                </div>` },
              { label: 'Actions', right: true, render: (p) => `
                <div class="table-actions">
                  <a class="btn btn--sm btn--outline" href="project-form.html?id=${p.id}">${Icons.svg('pencil')}<span>Edit</span></a>
                  <button class="btn btn--sm btn--outline" data-toggle-pub="${p.id}" data-published="${p.published}">${p.published ? 'Unpublish' : 'Publish'}</button>
                  <button class="btn btn--sm btn--danger" data-del="${p.id}" data-title="${UI.esc(p.title)}">${Icons.svg('trash')}</button>
                </div>` }
            ],
            res.data,
            { emptyTitle: 'No projects yet', emptyMessage: 'Create your first portfolio project.', emptyIcon: 'briefcase' }
          );
          Icons.render(tableEl);
          UI.renderPagination(document.getElementById('projects-pagination'), res, (p) => { state.page = p; load(); });

          tableEl.querySelectorAll('[data-toggle-pub]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              try {
                await API.patch(`/projects/${btn.dataset.togglePub}`, { published: btn.dataset.published !== 'true' });
                UI.toast(btn.dataset.published === 'true' ? 'Project unpublished.' : 'Project published.', 'success');
                load();
              } catch (err) { UI.toast(err.message, 'error'); }
            });
          });
          tableEl.querySelectorAll('[data-del]').forEach((btn) => {
            btn.addEventListener('click', () => {
              Admin.confirmDialog(`Delete project "${btn.dataset.title}"? This cannot be undone.`, async () => {
                try {
                  await API.del(`/projects/${btn.dataset.del}`);
                  UI.toast('Project deleted.', 'success');
                  load();
                } catch (err) { UI.toast(err.message, 'error'); }
              });
            });
          });
        } catch (err) {
          tableEl.innerHTML = UI.emptyState('Unable to load projects', err.message, 'alert-triangle');
        }
      }

      const searchInput = document.getElementById('projects-search');
      searchInput.addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => { state.search = searchInput.value.trim(); state.page = 1; load(); }, 300);
      });
      document.getElementById('projects-filter').addEventListener('change', (e) => { state.category = e.target.value; state.page = 1; load(); });

      load();
    });
  </script>
</body>
</html>
