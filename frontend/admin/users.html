<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users | SurveyPro Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script defer src="/js/icons.js"></script>
  <script defer src="/js/api.js"></script>
  <script defer src="/js/ui.js"></script>
  <script defer src="/js/admin.js"></script>
</head>
<body>
  <div class="admin-topbar">
    <div class="topbar-left"><h1>Users</h1></div>
    <div class="topbar-actions">
      <button class="btn btn--sm btn--primary" id="new-user">New User</button>
    </div>
  </div>
  <div class="admin-content">
    <div class="panel">
      <div class="toolbar">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="search" id="users-search" placeholder="Search name or email…" aria-label="Search users">
        </div>
        <select id="users-filter" aria-label="Filter by role" style="padding:9px 12px;border:1px solid var(--light-gray);border-radius:6px;font-family:var(--font);">
          <option value="">All roles</option>
          <option value="admin">Admin</option>
          <option value="manager">Manager</option>
          <option value="surveyor">Surveyor</option>
          <option value="staff">Staff</option>
        </select>
      </div>
      <div id="users-table" style="padding:0 22px 22px;"></div>
      <div class="pagination" id="users-pagination" style="padding-bottom:20px;"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      if (!(await Admin.renderShell('users', 'Users'))) return;
      const tableEl = document.getElementById('users-table');
      const state = { page: 1, search: '', role: '' };
      let debounce;

      function userForm(user) {
        return `
          <form id="user-form" novalidate>
            <div class="form-grid">
              <div class="field">
                <label>Full Name <span class="required">*</span></label>
                <input name="name" type="text" required maxlength="120" value="${UI.esc(user ? user.name : '')}">
              </div>
              <div class="field">
                <label>Email <span class="required">*</span></label>
                <input name="email" type="email" required maxlength="180" value="${UI.esc(user ? user.email : '')}">
              </div>
              <div class="field">
                <label>Role</label>
                <select name="role">
                  ${['admin', 'manager', 'surveyor', 'staff'].map((r) => `<option value="${r}" ${user && user.role === r ? 'selected' : ''}>${r}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>Status</label>
                <select name="status">
                  <option value="active" ${!user || user.status === 'active' ? 'selected' : ''}>Active</option>
                  <option value="suspended" ${user && user.status === 'suspended' ? 'selected' : ''}>Suspended</option>
                </select>
              </div>
              <div class="field span-2">
                <label>${user ? 'New Password (leave blank to keep current)' : 'Password <span class="required">*</span>'}</label>
                <input name="password" type="password" autocomplete="new-password" minlength="8">
                <span class="hint">Minimum 8 characters</span>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn--outline" data-close>Cancel</button>
              <button class="btn btn--primary" type="submit">Save User</button>
            </div>
          </form>`;
      }

      function openForm(user) {
        const { overlay, close } = Admin.openModal(user ? `Edit User — ${user.name}` : 'New User', userForm(user), { wide: true });
        overlay.querySelector('[data-close]').onclick = close;
        const form = overlay.querySelector('#user-form');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = form.querySelector('button[type="submit"]');
          UI.setBusy(btn, true, 'Saving…');
          try {
            if (user) {
              const payload = { name: form.name.value.trim(), email: form.email.value.trim(), role: form.role.value, status: form.status.value };
              if (form.password.value) payload.password = form.password.value;
              await API.patch(`/users/${user.id}`, payload);
            } else {
              await API.post('/users', {
                name: form.name.value.trim(),
                email: form.email.value.trim(),
                password: form.password.value,
                role: form.role.value,
                status: form.status.value
              });
            }
            UI.toast('User saved.', 'success');
            close();
            load();
          } catch (err) {
            UI.setBusy(btn, false);
            if (err.errors) UI.showFieldErrors(form, err.errors);
            UI.toast(err.message, 'error');
          }
        });
      }

      async function load() {
        tableEl.innerHTML = UI.loadingBlock('Loading users…');
        const params = new URLSearchParams({ page: state.page, limit: 15 });
        if (state.search) params.set('search', state.search);
        if (state.role) params.set('role', state.role);
        try {
          const res = await API.get(`/users?${params}`);
          tableEl.innerHTML = Admin.table(
            [
              { label: 'User', render: (u) => `
                <strong style="color:var(--navy);display:block;">${UI.esc(u.name)} ${u.id === Admin.user.id ? '<span class="badge badge--category" style="margin-left:6px;">You</span>' : ''}</strong>
                <span style="font-size:.8rem;color:var(--gray);">${UI.esc(u.email)}</span>` },
              { label: 'Role', render: (u) => `<span class="badge badge--category" style="text-transform:capitalize;">${UI.esc(u.role)}</span>` },
              { label: 'Status', render: (u) => UI.statusBadge(u.status === 'active' ? 'published' : 'draft') },
              { label: 'Joined', render: (u) => UI.formatDate(u.createdAt) },
              { label: 'Actions', right: true, render: (u) => `
                <div class="table-actions">
                  <button class="btn btn--sm btn--outline" data-edit="${u.id}">${Icons.svg('pencil')}<span>Edit</span></button>
                  ${u.id !== Admin.user.id ? `<button class="btn btn--sm btn--danger" data-del="${u.id}" data-name="${UI.esc(u.name)}">${Icons.svg('trash')}</button>` : ''}
                </div>` }
            ],
            res.data,
            { emptyTitle: 'No users found', emptyMessage: 'Add team members to grant dashboard access.', emptyIcon: 'users' }
          );
          Icons.render(tableEl);
          UI.renderPagination(document.getElementById('users-pagination'), res, (p) => { state.page = p; load(); });

          const byId = (id) => res.data.find((u) => String(u.id) === String(id));
          tableEl.querySelectorAll('[data-edit]').forEach((btn) => btn.addEventListener('click', () => openForm(byId(btn.dataset.edit))));
          tableEl.querySelectorAll('[data-del]').forEach((btn) => {
            btn.addEventListener('click', () => {
              Admin.confirmDialog(`Delete user "${btn.dataset.name}"? They will lose dashboard access.`, async () => {
                try { await API.del(`/users/${btn.dataset.del}`); UI.toast('User deleted.', 'success'); load(); }
                catch (err) { UI.toast(err.message, 'error'); }
              });
            });
          });
        } catch (err) {
          tableEl.innerHTML = UI.emptyState('Unable to load users', err.message, 'alert-triangle');
        }
      }

      const searchInput = document.getElementById('users-search');
      searchInput.addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => { state.search = searchInput.value.trim(); state.page = 1; load(); }, 300);
      });
      document.getElementById('users-filter').addEventListener('change', (e) => { state.role = e.target.value; state.page = 1; load(); });
      document.getElementById('new-user').addEventListener('click', () => openForm(null));
      load();
    });
  </script>
</body>
</html>
