<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | SurveyPro Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script defer src="/js/icons.js"></script>
  <script defer src="/js/api.js"></script>
  <script defer src="/js/ui.js"></script>
  <script defer src="/js/admin.js"></script>
</head>
<body>
  <div class="admin-topbar">
    <div class="topbar-left"><h1>Settings</h1></div>
  </div>
  <div class="admin-content" style="max-width:820px;">
    <form id="settings-form" novalidate>
      <div class="panel">
        <div class="panel-head">
          <div><h2>Trust Strip Statistics</h2><div class="panel-sub">Displayed on the homepage and about page</div></div>
        </div>
        <div class="panel-body">
          <div class="form-grid">
            <div class="field">
              <label for="st-years">Years of Experience</label>
              <input id="st-years" data-key="stats_years_experience" type="text" maxlength="20">
            </div>
            <div class="field">
              <label for="st-projects">Projects Completed</label>
              <input id="st-projects" data-key="stats_projects_completed" type="text" maxlength="20">
            </div>
            <div class="field">
              <label for="st-clients">Clients Served</label>
              <input id="st-clients" data-key="stats_clients_served" type="text" maxlength="20">
            </div>
            <div class="field">
              <label for="st-services">Surveying Services</label>
              <input id="st-services" data-key="stats_services_offered" type="text" maxlength="20">
            </div>
          </div>
          <p class="hint" style="color:var(--gray);font-size:.82rem;margin-top:10px;">Values are shown with a “+” suffix, e.g. “500” renders as “500+”.</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div><h2>Contact Details</h2><div class="panel-sub">Shown in the footer, contact page and email templates</div></div>
        </div>
        <div class="panel-body">
          <div class="form-grid">
            <div class="field span-2">
              <label for="st-address">Office Address</label>
              <input id="st-address" data-key="contact_address" type="text" maxlength="300">
            </div>
            <div class="field">
              <label for="st-phone">Phone</label>
              <input id="st-phone" data-key="contact_phone" type="text" maxlength="40">
            </div>
            <div class="field">
              <label for="st-email">Email</label>
              <input id="st-email" data-key="contact_email" type="email" maxlength="180">
            </div>
            <div class="field span-2">
              <label for="st-hours">Business Hours</label>
              <input id="st-hours" data-key="contact_hours" type="text" maxlength="200">
            </div>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn--primary" type="submit" id="save-settings">Save Settings</button>
      </div>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      if (!(await Admin.renderShell('settings', 'Settings'))) return;

      const form = document.getElementById('settings-form');
      try {
        const res = await API.get('/dashboard/settings');
        form.querySelectorAll('[data-key]').forEach((input) => {
          input.value = res.settings[input.dataset.key] || '';
        });
      } catch (err) {
        UI.toast('Unable to load settings.', 'error');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('save-settings');
        UI.setBusy(btn, true, 'Saving…');
        const payload = {};
        form.querySelectorAll('[data-key]').forEach((input) => {
          payload[input.dataset.key] = input.value;
        });
        try {
          await API.put('/dashboard/settings', payload);
          UI.toast('Settings saved.', 'success');
        } catch (err) {
          UI.toast(err.message, 'error');
        } finally {
          UI.setBusy(btn, false);
        }
      });
    });
  </script>
</body>
</html>
